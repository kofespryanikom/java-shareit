spring:
  main:
    log-startup-info: false
    banner-mode: off
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://db:5432/shares_db
    username: dbuser
    password: 12345
    driverClassName: org.postgresql.Driver
  profiles:
    active: docker
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: trace
